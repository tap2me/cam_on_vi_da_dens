<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tạo thiệp của riêng bạn 💌</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background: linear-gradient(180deg, #ffc5d3 0%, #ff8fa3 100%);
      background-attachment: fixed;
      min-height: 100vh;
      font-family: 'Cambria', serif;
      color: #4a2835;
      padding: 28px 14px 60px;
    }

    .wrap {
      max-width: 460px;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      gap: 18px;
    }

    h1 {
      font-size: 1.9rem;
      color: #b81446;
      text-align: center;
      text-shadow: 0 3px 12px rgba(255, 255, 255, 0.8);
      line-height: 1.3;
    }

    .sub {
      text-align: center;
      color: #9c1039;
      font-size: 1.05rem;
      margin-top: -8px;
    }

    .card {
      width: 100%;
      background: rgba(255, 255, 255, 0.86);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      border-radius: 26px;
      padding: 22px 18px;
      box-shadow: 0 10px 30px rgba(224, 169, 196, 0.3);
      border: 1px solid rgba(255, 255, 255, 0.7);
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .notice {
      background: #fff3cd;
      border: 1px solid #f0d58a;
      color: #6b4e00;
      border-radius: 16px;
      padding: 12px 14px;
      font-size: 0.95rem;
      line-height: 1.5;
    }

    .field {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .lbl {
      font-weight: 700;
      color: #9c3d62;
      font-size: 1rem;
    }

    .lbl small {
      font-weight: 400;
      color: #9c7a88;
      font-size: 0.82rem;
    }

    input[type="text"], textarea, select {
      width: 100%;
      font-family: inherit;
      font-size: 1rem;
      color: #4a2835;
      background: #fff;
      border: 1.5px solid #f2bac9;
      border-radius: 14px;
      padding: 10px 12px;
      outline: none;
      transition: border-color 0.2s, box-shadow 0.2s;
    }

    input[type="text"]:focus, textarea:focus, select:focus {
      border-color: #e85a71;
      box-shadow: 0 0 0 3px rgba(232, 90, 113, 0.15);
    }

    textarea {
      resize: vertical;
      line-height: 1.6;
    }

    /* Lưới ảnh */
    .photos {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
    }

    .thumb, .add-photo {
      position: relative;
      aspect-ratio: 1;
      border-radius: 14px;
      overflow: hidden;
    }

    .thumb {
      cursor: pointer;
      box-shadow: 0 3px 8px rgba(0, 0, 0, 0.08);
    }

    .thumb img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .thumb .badge {
      position: absolute;
      left: 6px;
      bottom: 6px;
      background: rgba(184, 20, 70, 0.85);
      color: #fff;
      font-size: 0.72rem;
      padding: 2px 8px;
      border-radius: 10px;
    }

    .thumb .remove {
      position: absolute;
      top: 5px;
      right: 5px;
      width: 26px;
      height: 26px;
      border-radius: 50%;
      border: none;
      background: rgba(0, 0, 0, 0.5);
      color: #fff;
      font-size: 15px;
      line-height: 26px;
      cursor: pointer;
    }

    .add-photo {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 2px;
      border: 2px dashed #e89ab0;
      background: #fff7f9;
      color: #d83a6f;
      font-size: 2rem;
      cursor: pointer;
    }

    .add-photo span {
      font-size: 0.78rem;
    }

    .hint {
      font-size: 0.82rem;
      color: #9c7a88;
    }

    /* Nút */
    .btn {
      background: linear-gradient(135deg, #e85a71 0%, #b83b5e 100%);
      color: #fff;
      border: none;
      font-family: inherit;
      font-size: 1.25rem;
      font-weight: 700;
      padding: 13px;
      border-radius: 40px;
      cursor: pointer;
      box-shadow: 0 6px 18px rgba(184, 59, 94, 0.35);
      transition: transform 0.2s, opacity 0.2s;
    }

    .btn:active {
      transform: scale(0.96);
    }

    .btn:disabled {
      opacity: 0.6;
      cursor: default;
    }

    .btn-sec {
      flex: 1;
      text-align: center;
      text-decoration: none;
      background: #fff;
      color: #b83b5e;
      border: 1.5px solid #f2bac9;
      font-family: inherit;
      font-size: 0.95rem;
      font-weight: 700;
      padding: 10px 8px;
      border-radius: 30px;
      cursor: pointer;
    }

    .progress {
      height: 8px;
      border-radius: 8px;
      background: #f5dbe4;
      overflow: hidden;
    }

    .progress-bar {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, #ff8fa3, #d83a6f);
      transition: width 0.3s ease;
    }

    .status {
      text-align: center;
      font-size: 0.95rem;
      color: #9c3d62;
      min-height: 1.2em;
    }

    .status.error {
      color: #c0182f;
    }

    /* Kết quả */
    .result h2 {
      font-size: 1.35rem;
      color: #b83b5e;
      text-align: center;
    }

    .link-row {
      display: flex;
      gap: 8px;
    }

    .link-row input {
      flex: 1;
      min-width: 0;
      font-size: 0.9rem;
    }

    .link-row button {
      flex-shrink: 0;
      background: #d83a6f;
      color: #fff;
      border: none;
      border-radius: 14px;
      padding: 0 14px;
      font-family: inherit;
      font-weight: 700;
      cursor: pointer;
    }

    .actions {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }

    .back {
      text-align: center;
      color: #9c1039;
      font-size: 0.95rem;
    }

    [hidden] {
      display: none !important;
    }
  </style>
</head>
<body>
  <div class="wrap">
    <h1>💌 Tạo thiệp của riêng bạn</h1>
    <p class="sub">Tải ảnh lên, viết vài lời, rồi nhận một đường link riêng để gửi tặng 💖</p>

    <div class="notice" id="notice" hidden></div>

    <form class="card" id="form" novalidate>
      <label class="field">
        <span class="lbl">Gửi tới ai?</span>
        <input type="text" id="ten" maxlength="40" placeholder="VD: Chị Lan xinh đẹp">
      </label>

      <div class="field">
        <span class="lbl">Ảnh kỷ niệm <small>(tối đa <span id="maxPhotosText">10</span> ảnh)</small></span>
        <div class="photos" id="photos">
          <label class="add-photo" id="addPhoto">
            ＋<span>Thêm ảnh</span>
            <input type="file" id="fileInput" accept="image/*" multiple hidden>
          </label>
        </div>
        <span class="hint">Chạm vào một ảnh để chọn làm ảnh lớn.</span>
      </div>

      <label class="field">
        <span class="lbl">Lời chào ở màn hình đầu</span>
        <input type="text" id="loiChao" maxlength="60" value="✨ Cảm ơn vì đã đến ✨">
      </label>

      <label class="field">
        <span class="lbl">Tiêu đề khung ảnh</span>
        <input type="text" id="tieuDe" maxlength="60" placeholder="💌 Gửi bạn 💞">
      </label>

      <label class="field">
        <span class="lbl">Lời nhắn <small>(mỗi dòng là một câu, sẽ sáng lên khi người nhận cuộn tới)</small></span>
        <textarea id="loiNhan" rows="6"></textarea>
      </label>

      <div class="field">
        <span class="lbl">Nhạc nền</span>
        <select id="songSelect"></select>
        <div class="field" id="ownSong" hidden>
          <input type="file" id="songFile" accept="audio/mpeg,audio/mp3,audio/*">
          <input type="text" id="songTitle" maxlength="60" placeholder="Tên bài hát">
        </div>
      </div>

      <button type="submit" class="btn" id="btnCreate">Tạo link 💖</button>
      <div class="progress" id="progress" hidden><div class="progress-bar" id="progressBar"></div></div>
      <p class="status" id="status"></p>
    </form>

    <div class="card result" id="result" hidden>
      <h2>🎉 Thiệp đã sẵn sàng!</h2>
      <p>Gửi đường link này cho người ấy nhé:</p>
      <div class="link-row">
        <input type="text" id="linkOut" readonly>
        <button type="button" id="btnCopy">Sao chép</button>
      </div>
      <div class="actions">
        <a class="btn-sec" id="btnOpen" target="_blank" rel="noopener">Xem thử</a>
        <button type="button" class="btn-sec" id="btnShare" hidden>Chia sẻ</button>
        <button type="button" class="btn-sec" id="btnAgain">Tạo thiệp khác</button>
      </div>
    </div>

    <a class="back" href="./">← Về trang chính</a>
  </div>

  <script src="config.js"></script>
  <script>
    const CFG = window.THIEP_CONFIG || {};
    const MAX_PHOTOS = CFG.maxPhotos || 10;
    const MAX_SONG_MB = CFG.maxSongMB || 15;
    const $ = id => document.getElementById(id);

    // --- 0. KIỂM TRA CẤU HÌNH ---
    const configured = Boolean(CFG.cloudName && CFG.uploadPreset);
    if (!configured) {
      $("notice").hidden = false;
      $("notice").textContent =
        "⚠️ Trang tạo thiệp chưa được cấu hình. Chủ trang cần điền cloudName và uploadPreset " +
        "(tài khoản Cloudinary) vào file config.js — xem hướng dẫn trong README.md.";
    }
    $("maxPhotosText").textContent = MAX_PHOTOS;

    // --- 1. TỰ ĐIỀN TIÊU ĐỀ + LỜI NHẮN THEO TÊN (cho tới khi người dùng tự sửa) ---
    const edited = new Set();
    ["tieuDe", "loiNhan"].forEach(id => $(id).addEventListener("input", () => edited.add(id)));

    function defaultMessage(ten) {
      return [
        `Gửi ${ten},`,
        "cảm ơn vì đã đến và cùng mình lưu lại những khoảnh khắc thật đẹp.",
        "Mỗi tấm hình ở đây là một mảnh ký ức mà mình muốn gửi riêng cho bạn.",
        "Chúc bạn luôn bình an, rạng rỡ và thật nhiều niềm vui nhé 💖"
      ].join("\n");
    }

    function fillDefaults() {
      const ten = $("ten").value.trim() || "bạn";
      if (!edited.has("tieuDe")) $("tieuDe").value = `💌 Gửi ${ten} 💞`;
      if (!edited.has("loiNhan")) $("loiNhan").value = defaultMessage(ten);
    }
    $("ten").addEventListener("input", fillDefaults);
    fillDefaults();

    // --- 2. CHỌN ẢNH ---
    let photos = []; // [{ file, preview }]

    $("fileInput").addEventListener("change", e => {
      const files = [...e.target.files].filter(f => f.type.startsWith("image/") || /\.(heic|heif)$/i.test(f.name));
      const room = MAX_PHOTOS - photos.length;
      if (files.length > room) setStatus(`Chỉ thêm được tối đa ${MAX_PHOTOS} ảnh thôi nhé.`, true);
      files.slice(0, room).forEach(file => photos.push({ file, preview: URL.createObjectURL(file) }));
      e.target.value = "";
      renderPhotos();
    });

    function renderPhotos() {
      const grid = $("photos");
      grid.querySelectorAll(".thumb").forEach(el => el.remove());
      photos.forEach((p, i) => {
        const div = document.createElement("div");
        div.className = "thumb";
        const img = document.createElement("img");
        img.src = p.preview;
        img.alt = "";
        div.appendChild(img);

        if (i === 0) {
          const badge = document.createElement("span");
          badge.className = "badge";
          badge.textContent = "Ảnh lớn";
          div.appendChild(badge);
        }

        const remove = document.createElement("button");
        remove.type = "button";
        remove.className = "remove";
        remove.textContent = "×";
        remove.title = "Bỏ ảnh này";
        remove.onclick = ev => {
          ev.stopPropagation();
          URL.revokeObjectURL(p.preview);
          photos.splice(i, 1);
          renderPhotos();
        };
        div.appendChild(remove);

        div.onclick = () => {
          photos.unshift(photos.splice(i, 1)[0]);
          renderPhotos();
        };
        grid.insertBefore(div, $("addPhoto"));
      });
      $("addPhoto").hidden = photos.length >= MAX_PHOTOS;
    }

    // --- 3. CHỌN NHẠC ---
    const OWN_SONG = "__own__";
    (CFG.songs || []).forEach(s => $("songSelect").add(new Option("🎵 " + s.title, s.file)));
    $("songSelect").add(new Option("📁 Tải bài hát của bạn (.mp3)", OWN_SONG));
    $("songSelect").addEventListener("change", () => {
      $("ownSong").hidden = $("songSelect").value !== OWN_SONG;
    });
    $("songFile").addEventListener("change", () => {
      const f = $("songFile").files[0];
      if (f && !$("songTitle").value) $("songTitle").value = f.name.replace(/\.[^.]+$/, "");
    });

    // --- 4. XỬ LÝ ẢNH: thu nhỏ để tải nhanh ---
    function shrinkImage(file, maxSide = 1600, quality = 0.85) {
      return new Promise((resolve, reject) => {
        const url = URL.createObjectURL(file);
        const img = new Image();
        img.onload = () => {
          const scale = Math.min(1, maxSide / Math.max(img.naturalWidth, img.naturalHeight));
          const w = Math.round(img.naturalWidth * scale);
          const h = Math.round(img.naturalHeight * scale);
          const canvas = document.createElement("canvas");
          canvas.width = w;
          canvas.height = h;
          const ctx = canvas.getContext("2d");
          ctx.fillStyle = "#fff";
          ctx.fillRect(0, 0, w, h);
          ctx.drawImage(img, 0, 0, w, h);
          URL.revokeObjectURL(url);
          canvas.toBlob(b => b ? resolve(b) : reject(new Error("Không xử lý được ảnh.")), "image/jpeg", quality);
        };
        img.onerror = () => {
          URL.revokeObjectURL(url);
          reject(new Error(`Không đọc được ảnh "${file.name}". Bạn thử ảnh JPG/PNG khác nhé.`));
        };
        img.src = url;
      });
    }

    // --- 5. TẢI LÊN CLOUDINARY ---
    async function upload(blob, resourceType, filename, extra = {}) {
      const fd = new FormData();
      fd.append("file", blob, filename);
      fd.append("upload_preset", CFG.uploadPreset);
      Object.entries(extra).forEach(([k, v]) => fd.append(k, v));

      let res, data;
      try {
        res = await fetch(`https://api.cloudinary.com/v1_1/${CFG.cloudName}/${resourceType}/upload`, {
          method: "POST",
          body: fd
        });
        data = await res.json();
      } catch (e) {
        throw new Error("Mất kết nối mạng, bạn thử lại nhé.");
      }
      if (!res.ok) throw new Error("Lỗi tải lên: " + ((data.error && data.error.message) || res.status));
      return data;
    }

    // Tạo mã link dễ đọc: tên không dấu + đuôi ngẫu nhiên, VD "chi-lan-x8p3k2"
    function makeSlug(ten) {
      const base = ten.normalize("NFD").replace(/[̀-ͯ]/g, "")
        .replace(/[đĐ]/g, "d").toLowerCase()
        .replace(/[^a-z0-9]+/g, "-").replace(/^-+|-+$/g, "")
        .slice(0, 24).replace(/-+$/, "") || "thiep";
      const chars = "abcdefghijkmnpqrstuvwxyz23456789";
      const rand = [...crypto.getRandomValues(new Uint8Array(6))].map(x => chars[x % chars.length]).join("");
      return base + "-" + rand;
    }

    // --- 6. TẠO THIỆP ---
    function setStatus(text, isError = false) {
      $("status").textContent = text;
      $("status").classList.toggle("error", isError);
    }

    function setProgress(done, total) {
      $("progress").hidden = false;
      $("progressBar").style.width = Math.round((done / total) * 100) + "%";
    }

    $("form").addEventListener("submit", async e => {
      e.preventDefault();
      if (!configured) return setStatus("Trang chưa được cấu hình (xem khung vàng ở trên).", true);

      const ten = $("ten").value.trim();
      const ownSong = $("songSelect").value === OWN_SONG;
      const songFile = $("songFile").files[0];
      const lines = $("loiNhan").value.split("\n").map(s => s.trim()).filter(Boolean);

      if (!ten) return setStatus("Bạn nhập tên người nhận nhé 💕", true);
      if (!photos.length) return setStatus("Bạn thêm ít nhất 1 ảnh nhé 📸", true);
      if (!lines.length) return setStatus("Bạn viết vài lời nhắn nhé ✍️", true);
      if (ownSong && !songFile) return setStatus("Bạn chọn file nhạc .mp3 nhé 🎵", true);
      if (ownSong && songFile.size > MAX_SONG_MB * 1024 * 1024) {
        return setStatus(`File nhạc lớn quá (tối đa ${MAX_SONG_MB}MB).`, true);
      }

      $("btnCreate").disabled = true;
      const total = photos.length + (ownSong ? 1 : 0) + 1;
      let done = 0;
      setProgress(0, total);

      try {
        const anh = [];
        for (let i = 0; i < photos.length; i++) {
          setStatus(`Đang tải ảnh ${i + 1}/${photos.length}...`);
          const blob = await shrinkImage(photos[i].file);
          const data = await upload(blob, "image", `anh-${i + 1}.jpg`);
          anh.push(data.secure_url);
          setProgress(++done, total);
        }

        let nhac, tenBai;
        if (ownSong) {
          setStatus("Đang tải bài hát...");
          const data = await upload(songFile, "video", songFile.name); // Cloudinary xếp âm thanh vào loại "video"
          nhac = data.secure_url;
          tenBai = $("songTitle").value.trim() || songFile.name.replace(/\.[^.]+$/, "");
          setProgress(++done, total);
        } else {
          const song = (CFG.songs || []).find(s => s.file === $("songSelect").value) || {};
          nhac = song.file;
          tenBai = song.title;
        }

        setStatus("Đang tạo link...");
        const info = {
          ten,
          loi_chao: $("loiChao").value.trim() || "✨ Cảm ơn vì đã đến ✨",
          tieu_de: $("tieuDe").value.trim() || `💌 Gửi ${ten} 💞`,
          nhac,
          ten_bai: tenBai,
          anh,
          loi_nhan: lines,
          tao_luc: new Date().toISOString()
        };
        const json = new Blob([JSON.stringify(info, null, 2)], { type: "application/json" });
        const data = await upload(json, "raw", "info.json", { public_id: makeSlug(ten) });
        setProgress(++done, total);

        showResult(new URL("./", location.href).href + "?id=" + data.public_id, ten);
        setStatus("");
      } catch (err) {
        setStatus(err.message, true);
      } finally {
        $("btnCreate").disabled = false;
      }
    });

    // --- 7. HIỆN LINK ĐỂ CHIA SẺ ---
    function showResult(link, ten) {
      $("form").hidden = true;
      $("result").hidden = false;
      $("linkOut").value = link;
      $("btnOpen").href = link;
      if (navigator.share) {
        $("btnShare").hidden = false;
        $("btnShare").onclick = () => navigator.share({
          title: "💌 Một lời nhắn dành cho " + ten,
          url: link
        }).catch(() => {});
      }
      $("result").scrollIntoView({ behavior: "smooth" });
    }

    $("btnCopy").addEventListener("click", async () => {
      const input = $("linkOut");
      try {
        await navigator.clipboard.writeText(input.value);
      } catch (e) {
        input.select();
        document.execCommand("copy");
      }
      $("btnCopy").textContent = "Đã chép ✓";
      setTimeout(() => $("btnCopy").textContent = "Sao chép", 1800);
    });

    $("btnAgain").addEventListener("click", () => {
      photos.forEach(p => URL.revokeObjectURL(p.preview));
      photos = [];
      renderPhotos();
      $("ten").value = "";
      edited.clear();
      fillDefaults();
      $("progress").hidden = true;
      $("result").hidden = true;
      $("form").hidden = false;
      window.scrollTo({ top: 0, behavior: "smooth" });
    });
  </script>
</body>
</html>
